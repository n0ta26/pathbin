name: CD

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag and release notes
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} must use the v<major>.<minor>.<patch> format"
            exit 1
          fi

          if ! git ls-remote --exit-code origin \
            "refs/tags/${GITHUB_REF_NAME}^{}" > /dev/null; then
            echo "::error::${GITHUB_REF_NAME} must be an annotated or signed tag"
            exit 1
          fi

          package_version="$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          if [[ "$GITHUB_REF_NAME" != "v${package_version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo package version ${package_version}"
            exit 1
          fi

          expected_heading="# pathbin ${GITHUB_REF_NAME}"
          actual_heading="$(head -n 1 RELEASE_NOTES.md)"
          if [[ "$actual_heading" != "$expected_heading" ]]; then
            echo "::error::RELEASE_NOTES.md must start with '${expected_heading}'"
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_extension: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive_extension: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive_extension: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_extension: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_extension: zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive_name="pathbin-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$archive_name"
          cp "target/${{ matrix.target }}/release/pathbin" README.md LICENSE "$archive_name/"
          tar -czf "${archive_name}.tar.gz" "$archive_name"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archiveName = "pathbin-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $archiveName
          Copy-Item `
            -Path "target/${{ matrix.target }}/release/pathbin.exe", "README.md", "LICENSE" `
            -Destination $archiveName
          Compress-Archive -Path $archiveName -DestinationPath "$archiveName.zip"

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: pathbin-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive_extension }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          cd dist
          sha256sum pathbin-* > SHA256SUMS

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          previous_tag=""
          while IFS= read -r tag; do
            if [[ "$tag" != "$GITHUB_REF_NAME" ]]; then
              previous_tag="$tag"
              break
            fi
          done < <(
            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq 'map(select(.draft == false and .prerelease == false)) | .[].tag_name'
          )

          generate_args=(
            --field "tag_name=${GITHUB_REF_NAME}"
            --field "target_commitish=${GITHUB_SHA}"
          )
          if [[ -n "$previous_tag" ]]; then
            generate_args+=(--field "previous_tag_name=${previous_tag}")
          fi

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            "${generate_args[@]}" \
            --jq .body > GENERATED_CHANGELOG.md

          cp RELEASE_NOTES.md GENERATED_RELEASE_NOTES.md
          printf '\n' >> GENERATED_RELEASE_NOTES.md
          if ! grep -q "^## What's Changed" GENERATED_CHANGELOG.md; then
            printf "## What's Changed\n\n" >> GENERATED_RELEASE_NOTES.md
          fi
          cat GENERATED_CHANGELOG.md >> GENERATED_RELEASE_NOTES.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "pathbin ${GITHUB_REF_NAME}" \
              --notes-file GENERATED_RELEASE_NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --title "pathbin ${GITHUB_REF_NAME}" \
              --notes-file GENERATED_RELEASE_NOTES.md
          fi
