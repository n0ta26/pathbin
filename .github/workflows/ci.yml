name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

  required:
    name: Required CI
    if: always()
    needs:
      - quality
    runs-on: ubuntu-latest

    steps:
      - name: Require every quality job to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          if [[ "$QUALITY_RESULT" != "success" ]]; then
            echo "::error::One or more quality jobs did not pass"
            exit 1
          fi
